<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="shortcut icon" href="static/webicon.ico">
    <title>Streech editor（ストリーチ）</title>
  </head>
  <body>
    <style>
      html {
        transform: scale(0.85) !important;
        transform-origin: top left !important;
        width: 117.64705882352942% !important;
        height: 117.64705882352942% !important;
        overflow: hidden !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
      }
      body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        overflow: hidden !important;
      }
      [class*="menu-bar_menu-bar_"] { background-color: #00d631 !important; }
    </style>
    
    <script type="text/javascript">
      (function() {
        const SCALE = 0.85;
        const PATCHED_MARK = Symbol('patched');

        // 1. 座標の安全な書き換え（二重処理を完全にガード）
        function patchEvent(e) {
          if (!e || e[PATCHED_MARK]) return;
          e[PATCHED_MARK] = true;

          const props = ['clientX', 'clientY', 'pageX', 'pageY', 'screenX', 'screenY'];
          
          props.forEach(prop => {
            if (typeof e[prop] === 'number') {
              const originalValue = e[prop];
              Object.defineProperty(e, prop, {
                value: originalValue / SCALE,
                configurable: true,
                writable: true
              });
            }
          });

          ['touches', 'targetTouches', 'changedTouches'].forEach(touchListProp => {
            if (e[touchListProp] && e[touchListProp].length) {
              for (let i = 0; i < e[touchListProp].length; i++) {
                const touch = e[touchListProp][i];
                if (touch && !touch[PATCHED_MARK]) {
                  touch[PATCHED_MARK] = true;
                  props.forEach(prop => {
                    if (typeof touch[prop] === 'number') {
                      const originalTouchValue = touch[prop];
                      Object.defineProperty(touch, prop, {
                        value: originalTouchValue / SCALE,
                        configurable: true,
                        writable: true
                      });
                    }
                  });
                }
              }
            }
          });
        }

        // ラッパー関数を管理するマップ（removeEventListener のバグ対策）
        const listenerMap = new WeakMap();

        // addEventListener のフック
        const originalAddEventListener = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function(type, listener, options) {
          const targetEvents = [
            'mousedown', 'mousemove', 'mouseup', 
            'touchstart', 'touchmove', 'touchend', 'touchcancel',
            'pointerdown', 'pointermove', 'pointerup', 'pointercancel',
            'click', 'dblclick', 'contextmenu'
          ];
          
          if (targetEvents.includes(type) && typeof listener === 'function') {
            const wrappedListener = function(e) {
              patchEvent(e);
              return listener.call(this, e);
            };

            // メモリリークを防ぎつつ元の関数とラッパーを紐付け
            if (!listenerMap.has(this)) {
              listenerMap.set(this, new Map());
            }
            listenerMap.get(this).set(listener, wrappedListener);

            return originalAddEventListener.call(this, type, wrappedListener, options);
          }
          return originalAddEventListener.call(this, type, listener, options);
        };

        // removeEventListener もフックして解除を確実に成功させる
        const originalRemoveEventListener = EventTarget.prototype.removeEventListener;
        EventTarget.prototype.removeEventListener = function(type, listener, options) {
          if (typeof listener === 'function' && listenerMap.has(this)) {
            const targetMap = listenerMap.get(this);
            const wrappedListener = targetMap.get(listener);
            if (wrappedListener) {
              targetMap.delete(listener);
              return originalRemoveEventListener.call(this, type, wrappedListener, options);
            }
          }
          return originalRemoveEventListener.call(this, type, listener, options);
        };

        // 2. getBoundingClientRect の安全な倍率補正
        const originalGetBoundingClientRect = Element.prototype.getBoundingClientRect;
        Element.prototype.getBoundingClientRect = function() {
          const rect = originalGetBoundingClientRect.call(this);
          return {
            left: rect.left / SCALE,
            top: rect.top / SCALE,
            right: rect.right / SCALE,
            bottom: rect.bottom / SCALE,
            width: rect.width / SCALE,
            height: rect.height / SCALE,
            x: (rect.x ?? rect.left) / SCALE,
            y: (rect.y ?? rect.top) / SCALE
          };
        };
      })();
    </script>

    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>
  </body>
</html>
